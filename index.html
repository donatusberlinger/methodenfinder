<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Methodenfinder | Lernen gemeinsam gestalten</title>
<style>
:root{font-family:system-ui,sans-serif;color:#193e38;background:#f4f3ec}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:48px 24px}header{max-width:720px;margin-bottom:36px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:750;color:#56745d}h1{font-size:clamp(36px,6vw,64px);line-height:1.06;letter-spacing:-.04em;margin:18px 0}header p{font-size:19px;line-height:1.6;color:#52645c}.filters{background:#e4e9dc;padding:24px;border-radius:20px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:18px}label{display:grid;gap:8px;font-weight:650;font-size:14px}select{width:100%;padding:12px 8px;border:1px solid #a4b5a3;border-radius:8px;background:white;color:#193e38;font:inherit}button{background:#193e38;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font:inherit}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c27a29;outline-offset:4px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:24px 0;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}article{background:#fff;border:1px solid #d9dfd2;border-radius:18px;padding:26px}h2{font-size:25px;margin:12px 0}.tag{font-size:12px;color:#46674e;background:#edf1e6;border-radius:20px;padding:5px 10px;display:inline-block}.meta{font-size:14px;color:#647267}article p,li{line-height:1.6}summary{cursor:pointer;font-weight:700;padding:10px 0}ol{padding-left:22px}li{padding:4px 0}.hint{border-left:3px solid #d6a34d;padding-left:12px;font-size:14px}footer{margin-top:32px;color:#647267;font-size:13px}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}main{padding-top:28px}}@media(max-width:420px){.filters{grid-template-columns:1fr}}
</style></head><body><main><header><span class="eyebrow">Werkstatt für gute Lehre</span><h1>Welche Methode passt zu deinem Vorhaben?</h1><p>Fünf Ideen für aktives Lernen. Wähle dein Ziel und deinen Rahmen – und finde einen passenden Einstieg.</p></header>
<section class="filters" aria-label="Methoden filtern"><label>Lernziel<select id="goal"><option value="">Alle Ziele</option value="wissen">Wissen vertiefen</option><option value="austausch">Erfahrungen austauschen</option><option value="loesung">Lösungen entwickeln</option></select></label><label>Zeitbudget<select id="time"><option value="60">Bis 60 Minuten</option><option value="15">Bis 15 Minuten</option><option value="30">Bis 30 Minuten</option></select></label><label>Gruppe<select id="group"><option value="">Alle Grössen</option><option value="klein">Klein · 3–12</option><option value="gross">Gross · 13–30</option></select></label><label>Setting<select id="setting"><option value="">Alle Settings</option><option value="online">Online</option><option value="praesenz">Vor Ort</option></select></label></section>
<div class="toolbar"><p id="count" role="status" aria-live="polite"></p><button id="reset" type="button">Filter zurücksetzen</button></div><section class="grid" id="results" aria-label="Passende Methoden"></section><footer>Ein Experiment für Donatus · Zeitangaben sind Richtwerte. Passe Aufgaben und Ablauf an die Lernenden an.</footer></main>
<script>
const methods=[
{name:'Denken – Austauschen – Teilen',goal:'wissen',label:'Wissen vertiefen',time:15,group:['klein','gross'],intro:'Alle entwickeln zunächst eigene Gedanken, bevor sie diese mit anderen prüfen.',steps:['Stelle eine anspruchsvolle Frage. Jede Person notiert für sich eine begründete Antwort (3 Minuten).','Zu zweit Antworten vergleichen und eine gemeinsame Erkenntnis formulieren (6 Minuten).','Ausgewählte Erkenntnisse im Plenum sammeln und fachlich einordnen (6 Minuten).'],hint:'Online: Zweiergruppen in Breakout-Räumen. Bei grossen Gruppen nur ausgewählte Beiträge ins Plenum holen.'},
{name:'Gruppenpuzzle',goal:'wissen',label:'Wissen vertiefen',time:60,group:['gross'],intro:'Lernende erarbeiten unterschiedliche Teilthemen und erklären sie anschliessend einander.',steps:['Bilde Stammgruppen mit je drei Personen und verteile drei vorbereitete Teilthemen (5 Minuten).','Alle mit demselben Thema treffen sich in Expertengruppen und erarbeiten eine Erklärung (20 Minuten).','Zurück in den Stammgruppen erklären die Mitglieder ihre Themen (20 Minuten).','Eine gemeinsame Transferaufgabe lösen und offene Fragen fachlich klären (15 Minuten).'],hint:'Online: Räume und Material vorab vorbereiten. Eine gemeinsame Aufgabe verbindet die Teilthemen.'},
{name:'Erfahrungstandem',goal:'austausch',label:'Erfahrungen austauschen',time:15,group:['klein','gross'],intro:'Konkrete Erfahrungen werden zur Grundlage für neue Handlungsmöglichkeiten.',steps:['Eine Person schildert eine konkrete Lernsituation; die andere fragt nach, ohne sofort Rat zu geben (4 Minuten).','Rollen wechseln (4 Minuten).','Gemeinsam ein Muster und je einen nächsten Versuch festhalten (5 Minuten).','Eine Erkenntnis pro Tandem schriftlich sammeln (2 Minuten).'],hint:'Online: Zweiergruppen nutzen. Bei ungerader Zahl arbeitet eine Dreiergruppe mit kürzeren Redezeiten.'},
{name:'Kollegiale Kurzberatung',goal:'loesung',label:'Lösungen entwickeln',time:30,group:['klein'],intro:'Ein konkreter Praxisfall erhält mehrere Perspektiven und umsetzbare Handlungsoptionen.',steps:['In Gruppen von 3–6 Personen einen Fall und eine klare Beratungsfrage schildern (5 Minuten).','Verständnisfragen stellen, ohne bereits Lösungen anzubieten (5 Minuten).','Die beratenden Personen entwickeln Ideen; die fallgebende Person hört zu (12 Minuten).','Die fallgebende Person wählt einen nächsten Schritt und reflektiert den Nutzen (8 Minuten).'],hint:'Persönliche Fälle vertraulich behandeln. Bei 7–12 Personen zwei Beratungsgruppen bilden.'},
{name:'Co-Creation-Werkstatt',goal:'loesung',label:'Lösungen entwickeln',time:60,group:['klein','gross'],intro:'Die Gruppe entwickelt gemeinsam einen ersten Entwurf und verbessert ihn durch Rückmeldungen.',steps:['Eine gemeinsame Herausforderung sowie Ziel und Gestaltungsspielraum klären (10 Minuten).','In Gruppen von 3–5 Personen Ideen sammeln und eine auswählen (10 Minuten).','Einen sichtbaren Entwurf erstellen, etwa einen Ablauf oder ein Lernprodukt (20 Minuten).','Entwürfe gegenseitig prüfen: Was hilft? Was fehlt? (10 Minuten).','Entwurf überarbeiten und nächste Schritte vereinbaren (10 Minuten).'],hint:'Online: Ein gemeinsames Whiteboard verwenden. Vorab klären, worüber die Gruppe tatsächlich entscheiden kann.'}
];
const ids=['goal','time','group','setting'];
function render(){const goal=document.getElementById('goal').value,time=Number(document.getElementById('time').value),group=document.getElementById('group').value;const found=methods.filter(m=>(!goal||m.goal===goal)&&m.time<=time&&(!group||m.group.includes(group)));document.getElementById('count').textContent=found.length+' von 5 Methoden passen';document.getElementById('results').innerHTML=found.length?found.map(m=>`<article><span class="tag">${m.label}</span><h2>${m.name}</h2><p class="meta">${m.time} Minuten · ${m.group.length===2?'3–30 Personen':'gross'===m.group[0]?'13–30 Personen':'3–12 Personen'} · ${document.getElementById('setting').value==='online'?'Online':document.getElementById('setting').value==='praesenz'?'Vor Ort':'Online und vor Ort'}</p><p>${m.intro}</p><details><summary>Ablauf ansehen</summary><ol>${m.steps.map(s=>'<li>'+s+'</li>').join('')}</ol><p class="hint">${m.hint}</p></details></article>`).join(''):'<article><h2>Für diesen Rahmen ist keine Methode hinterlegt.</h2><p>Erhöhe das Zeitbudget oder öffne die Auswahl bei Lernziel und Gruppengrösse.</p></article>';}
ids.forEach(id=>document.getElementById(id).addEventListener('change',render));document.getElementById('reset').addEventListener('click',()=>{ids.forEach(id=>document.getElementById(id).value=id==='time'?'60':'');render()});render();
</script></body></html>
